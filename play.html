<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101615"><title>Play — Medieval Duel Bench</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101615;color:#e8e4d6;font:12px system-ui,sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 20px;min-height:54px;border-bottom:1px solid #ddd2;flex-shrink:0}a{color:#d0b27b;text-decoration:none}a:hover{text-decoration:underline}.picker{display:flex;gap:12px;align-items:center}label{color:#9fa99b;font-size:10px}select,button{background:#1c2520;border:1px solid #b2be9d40;color:#e8e4d6;font:11px system-ui;padding:7px 10px}button{cursor:pointer}a:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #d0b27b;outline-offset:3px}.actions{display:flex;gap:18px;align-items:center;font-size:10px}iframe{border:0;display:block;width:100%;flex:1;min-height:0;background:#080d10}#notice{position:absolute;top:62px;right:20px;max-width:350px;font-size:12px;color:#e2d3b6;background:#17201d;border:1px solid #d0b27b66;padding:10px 14px}#notice:empty{display:none}noscript{padding:30px}noscript a{display:block;padding:10px}@media(max-width:620px){header{padding:9px 12px;gap:10px;flex-wrap:wrap}.picker label{display:none}.actions{gap:12px}.actions a{display:none}header>a{font-size:10px}select{max-width:165px}button{font-size:10px}}@media(max-width:380px){.actions{display:none}}
</style></head>
<body><header><a href="./#play">← All benchmarks</a><div class="picker"><label for="build">Choose a build</label><select id="build"><option value="ironmoor">Ironmoor Duel · Opus 5.5</option><option value="ashen-crown">Ashen Crown · Fable 5.2</option><option value="cinder-oath">Cinder Oath · OpenAI (unconfirmed)</option><option value="iron-vigil">Iron Vigil · OpenAI (unconfirmed)</option></select></div><div class="actions"><a id="standalone" href="ironmoor/">Open standalone ↗</a><button id="fullscreen" type="button">Fullscreen</button></div></header><p id="notice" role="status" aria-live="polite"></p><iframe id="game" title="Selected medieval duel" allow="fullscreen; autoplay" allowfullscreen></iframe>
<noscript>This player needs JavaScript. Open a standalone game instead:<a href="ironmoor/">Ironmoor Duel</a><a href="fable-5.2/">Ashen Crown</a><a href="codex/">Cinder Oath</a><a href="iron-vigil/">Iron Vigil</a></noscript>
<script>
'use strict';
const builds={'ironmoor':{name:'Ironmoor Duel',path:'ironmoor/index.html'},'ashen-crown':{name:'Ashen Crown',path:'fable-5.2/index.html'},'cinder-oath':{name:'Cinder Oath',path:'codex/index.html'},'iron-vigil':{name:'Iron Vigil',path:'iron-vigil/index.html'}};
const picker=document.getElementById('build'),frame=document.getElementById('game'),notice=document.getElementById('notice');
function selectBuild(key,updateAddress){if(!Object.prototype.hasOwnProperty.call(builds,key))key='ironmoor';const item=builds[key];picker.value=key;frame.title=item.name+' — playable benchmark';frame.src=item.path;document.title=item.name+' — Medieval Duel Bench';document.getElementById('standalone').href=item.path;notice.textContent='';if(updateAddress){const url=new URL(location.href);url.searchParams.set('game',key);history.replaceState(null,'',url);}return key;}
picker.addEventListener('change',()=>selectBuild(picker.value,true));
window.addEventListener('popstate',()=>selectBuild(new URLSearchParams(location.search).get('game'),false));
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await frame.requestFullscreen();}catch(e){notice.textContent='Fullscreen is unavailable in this browser. Use Open standalone for the full window.';}});
frame.addEventListener('load',()=>{try{frame.contentWindow.focus();}catch(e){}});
selectBuild(new URLSearchParams(location.search).get('game'),false);
</script></body></html>
